<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1114">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pack Rips — fan-made pack opening simulator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="app">
  <header id="top">
    <span class="cat"><i></i>Pokémon</span>
    <span class="wallet" id="cash" title="Play money">$0.00</span>
  </header>

  <main>
    <section id="packs"></section>
    <section id="showroom" class="page hidden"></section>
    <section id="collection" class="page hidden"></section>
    <section id="rewards" class="page hidden"></section>
    <section id="account" class="page hidden"></section>
  </main>

  <nav id="nav">
    <button class="on" data-act="view" data-view="packs"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="11" height="16" rx="2" transform="rotate(-8 9.5 13)"/><rect x="9" y="3" width="11" height="16" rx="2" transform="rotate(8 14.5 11)"/></svg>Packs</button>
    <button data-act="view" data-view="showroom"><svg viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5v2H3z"/><path d="M5 12h14v8H5z"/></svg>Showroom</button>
    <button data-act="view" data-view="collection"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="9.5" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><rect x="16" y="9.5" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="9.5" y="16" width="5" height="5" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/></svg>Collection</button>
    <button data-act="view" data-view="rewards"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 13h14v8H5z"/><path d="M12 8c-3-4-7-3-5 0zM12 8c3-4 7-3 5 0z"/></svg>Rewards</button>
    <button data-act="view" data-view="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle class="cut" cx="12" cy="9.5" r="3.5"/><path class="cut" d="M5.500 18.500c1.500-3 4-4 6.500-4s5 1 6.500 4a9 9 0 0 1-13 0z"/></svg>Account</button>
  </nav>

  <div id="rip" class="overlay hidden" role="dialog" aria-modal="true"></div>
  <div id="modal" class="overlay hidden" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="toast"></div>
</div>

<script src="js/cards.js?v=5"></script>
<script src="js/sim.js?v=5"></script>
<script src="js/audio.js?v=5"></script>
<script src="js/main.js?v=5"></script>
</body>
</html>
