<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070a16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pack Rips — fan-made pack opening simulator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header id="top">
  <a class="home" href="../index.html" title="Back to the game library">‹ Games</a>
  <h1>PACK RIPS</h1>
  <nav id="tabs">
    <button class="tab on" data-act="view" data-view="shop">Shop</button>
    <button class="tab" data-act="view" data-view="binder">Binder</button>
    <button class="tab" data-act="view" data-view="stats">Stats</button>
  </nav>
  <div class="wallet">
    <span class="cash" id="cash" title="Play money">$0.00</span>
    <button class="chip" id="topup" data-act="topup" title="Free play money">+ $100</button>
    <button class="chip" id="mute" data-act="mute" title="Sound">🔊</button>
  </div>
</header>

<main>
  <section id="shop" class="view"></section>
  <section id="binder" class="view hidden"></section>
  <section id="stats" class="view hidden"></section>
</main>

<footer>
  Play money only: nothing here can be bought, sold or cashed out. Unofficial fan project, not affiliated with,
  endorsed or sponsored by Nintendo, The Pokémon Company, Game Freak or Creatures. Card images and price
  snapshots come from <a href="https://tcgdex.dev" target="_blank" rel="noopener">TCGdex</a>. Pull odds are approximations.
</footer>

<div id="rip" class="overlay hidden" role="dialog" aria-modal="true"></div>
<div id="modal" class="overlay hidden" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>

<script src="js/sets/sv03.5.js?v=1"></script>
<script src="js/sets/sv08.5.js?v=1"></script>
<script src="js/sets/sv10.js?v=1"></script>
<script src="js/sets/sv08.js?v=1"></script>
<script src="js/sets/swsh7.js?v=1"></script>
<script src="js/sets/base1.js?v=1"></script>
<script src="js/sim.js?v=1"></script>
<script src="js/audio.js?v=1"></script>
<script src="js/main.js?v=1"></script>
</body>
</html>
