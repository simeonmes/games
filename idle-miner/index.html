<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140d08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Idle Miner — fan tribute</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<canvas id="game"></canvas>

<div id="scroller">
  <div id="sizer">
    <div id="world"></div>
  </div>
</div>

<header id="hud">
  <div class="money">
    <div class="cash" id="cash">$0</div>
    <div class="rate" id="rate">$0/s</div>
  </div>
  <div class="mine" id="mineName">Old Coal Mine</div>
  <div class="btns">
    <button id="minesBtn" class="hudbtn" title="Mines and geologists">⛰<span>Mines</span><i id="minesDot" class="dot hidden"></i></button>
    <button id="menuBtn" class="hudbtn" title="Menu">☰<span>Menu</span></button>
  </div>
</header>

<div id="boosts" class="boosts"></div>
<div id="toast" class="toast"></div>

<div id="modal" class="screen hidden" role="dialog" aria-modal="true">
  <div class="card" id="card"></div>
</div>

<script src="js/format.js?v=1"></script>
<script src="js/sim.js?v=1"></script>
<script src="js/audio.js?v=1"></script>
<script src="js/render.js?v=1"></script>
<script src="js/main.js?v=1"></script>
</body>
</html>
